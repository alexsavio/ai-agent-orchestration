id = "combinaut.todo"
name = "To-do popup"
version = "1.0.0"
min_herdr_version = "0.9.0"
description = "Opens the user to-do view in a popup titled 'Your to-do'."
platforms = ["linux", "macos"]

[[panes]]
id = "view"
title = "Your to-do"
placement = "popup"
width = "80%"
height = "80%"
command = ["sh", "-c", "exec python3 \"$HOME/.claude/coordinator/user-todo-view.py\" --popup"]

[[actions]]
id = "open"
title = "To-do: open the popup"
description = "Open the to-do view in a popup."
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin combinaut.todo --entrypoint view"]
