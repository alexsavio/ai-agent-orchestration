[legacy]
exempt = [".orchestration.toml", "scripts/legacy-guard*.mjs"]

[[legacy.rules]]
kind = "JSERB"
paths = ["**/*.js.erb"]

[[legacy.rules]]
kind = "JQUERY"
pattern = '\$\(|jQuery|\$\.ajax|ajax:(success|complete|error|send)|jquery[_-]ujs|rails-ujs|data-remote|remote: *true|\.trigger\(|select2|legacy-select'
paths = ["**/*.{js,mjs,cjs,jsx,ts,tsx,vue,erb,haml,hbs,ejs,coffee,rb}"]
exclude = ["app/assets/javascripts/**", "**/{spec,test,tests}/**", "**/*{.,_,-}{spec,test}.*"]

[[legacy.rules]]
kind = "LEGACY"
paths = ["app/assets/javascripts/**"]
exclude = ["**/*.{sh,bash,md}", "**/{spec,test,tests}/**", "**/*{.,_,-}{spec,test}.*"]

[[legacy.rules]]
kind = "TEST"
pattern = '\$\(|jQuery|\$\.ajax|ajax:(success|complete|error|send)|jquery[_-]ujs|rails-ujs|data-remote|remote: *true|\.trigger\(|select2|legacy-select'
paths = [
  "**/{spec,test,tests}/**/*.{js,mjs,cjs,jsx,ts,tsx,vue,erb,haml,hbs,ejs,coffee,rb}",
  "**/*{.,_,-}{spec,test}.{js,mjs,cjs,jsx,ts,tsx,vue,erb,haml,hbs,ejs,coffee,rb}",
  "**/*{.,_,-}{spec,test}.*.{js,mjs,cjs,jsx,ts,tsx,vue,erb,haml,hbs,ejs,coffee,rb}",
]

[[legacy.rules]]
kind = "LEGACY"
paths = ["app/assets/javascripts/**"]
exclude = ["**/*.{sh,bash,md}"]
