required-version = "==0.17.1"
target-version = "py311"
# Python files only: ruff 0.17 also formats Python code fences in Markdown.
extend-exclude = ["*.md"]

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
# test_support sets up the test sandbox when imported, so it stays ahead of
# the modules under test.
sections = { support = ["test_support"] }
section-order = ["future", "standard-library", "support", "third-party", "first-party", "local-folder"]
