name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      macos: ${{ steps.scope.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: scripts/ci/macos-scope.sh >>"$GITHUB_OUTPUT"

  macos:
    name: Validate (macos-latest)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.macos != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: brew install shellcheck bats-core
      - uses: ./.github/actions/validate

  ubuntu:
    name: Validate (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci/install-deps-ubuntu.sh
      - uses: ./.github/actions/validate
