name: Validate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      macos: ${{ github.event_name != 'pull_request' || github.event.pull_request.changed_files >= 3000 || steps.filter.outputs.macos == 'true' || steps.filter.outputs.validate == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            macos:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!docs/**'
              - '!.github/**'
            validate:
              - '.github/workflows/validate.yml'

  macos:
    name: Validate (macos-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.macos != 'false') }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: brew install shellcheck bats-core ripgrep parallel
      - uses: ./.github/actions/validate

  ubuntu:
    name: Validate (ubuntu-latest)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci/install-deps-ubuntu.sh
      - uses: ./.github/actions/validate
