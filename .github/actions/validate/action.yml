name: Validate
description: ShellCheck, Ruff, the PR tabs extension and the test suites
runs:
  using: composite
  steps:
    - name: ShellCheck
      shell: bash
      run: scripts/ci/shellcheck.sh
    - name: Ruff
      shell: bash
      run: scripts/ci/ruff.sh
    - name: Set up pnpm for the PR tabs extension
      if: runner.os == 'Linux'
      uses: pnpm/action-setup@v6
      with:
        package_json_file: chrome/pr-tabs/package.json
    - name: Set up Node for the PR tabs extension
      if: runner.os == 'Linux'
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: chrome/pr-tabs/pnpm-lock.yaml
    - name: PR tabs extension lint, types, tests and build check
      if: runner.os == 'Linux'
      shell: bash
      run: scripts/ci/pr-tabs.sh
    - name: Prove Linux runner systemctl tripwire
      if: runner.os == 'Linux'
      shell: bash
      run: scripts/ci/prove-linux-systemctl-tripwire.sh
    - name: Run hog against real Linux processes
      if: runner.os == 'Linux'
      shell: bash
      run: scripts/ci/run-hog-linux.sh
    - name: Run balance against real Linux processes
      if: runner.os == 'Linux'
      shell: bash
      run: scripts/ci/run-balance-linux.sh
    - name: Run workers entrypoint with fake Herdr
      shell: bash
      run: scripts/ci/run-workers-fake-herdr.sh
    - name: Run audit entrypoint with fake GitHub and Herdr
      shell: bash
      run: scripts/ci/run-audit-fake-github-herdr.sh
    - name: Validate isolated test suites
      shell: bash
      run: tests/run.sh
    - name: Verify Linux watcher units
      if: runner.os == 'Linux'
      shell: bash
      run: scripts/ci/verify-linux-watcher-units.sh
