name: Validate
description: ShellCheck and the test suites
runs:
  using: composite
  steps:
    - name: ShellCheck
      shell: bash
      run: scripts/ci/shellcheck.sh
    - name: Prove Linux runner systemctl tripwire
      if: runner.os == 'Linux'
      shell: bash
      run: scripts/ci/prove-linux-systemctl-tripwire.sh
    - name: Run hog against real Linux processes
      if: runner.os == 'Linux'
      shell: bash
      run: scripts/ci/run-hog-linux.sh
    - name: Run balance against real Linux processes
      if: runner.os == 'Linux'
      shell: bash
      run: scripts/ci/run-balance-linux.sh
    - name: Run workers entrypoint with fake Herdr
      shell: bash
      run: scripts/ci/run-workers-fake-herdr.sh
    - name: Run audit entrypoint with fake GitHub and Herdr
      shell: bash
      run: scripts/ci/run-audit-fake-github-herdr.sh
    - name: Validate isolated test suites
      shell: bash
      run: tests/run.sh
    - name: Verify Linux watcher units
      if: runner.os == 'Linux'
      shell: bash
      run: scripts/ci/verify-linux-watcher-units.sh
